name: Build APK (short log)
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q project.zip -d proj
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build unsigned release APK
        working-directory: proj
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --console=plain > build.log 2>&1 || { grep -m1 -A 22 "What went wrong" build.log > ../last-build-log.txt || tail -n 30 build.log > ../last-build-log.txt; cd ..; git config user.email ci@ezqmind.local; git config user.name ci; git add -f last-build-log.txt; git commit -m "short log run ${{ github.run_number }}"; git push; exit 1; }
      - name: Attach APK to release
        working-directory: proj
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create build-${{ github.run_number }} app/build/outputs/apk/release/app-release-unsigned.apk --title "EzQ Bridge build ${{ github.run_number }}" --notes "Unsigned APK, signed locally after download"
