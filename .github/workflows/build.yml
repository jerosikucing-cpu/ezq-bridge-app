name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q project.zip -d proj
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build unsigned release APK
        working-directory: proj
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --console=plain
      - name: Attach APK to release
        working-directory: proj
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create build-${{ github.run_number }} app/build/outputs/apk/release/app-release-unsigned.apk --title "EzQ Bridge build ${{ github.run_number }}" --notes "Unsigned APK, signed locally after download"
