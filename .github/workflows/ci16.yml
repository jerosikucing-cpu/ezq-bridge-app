name: Build APK (ci16)
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q project5.zip -d proj
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Diagnosa jaringan (Claude)
        id: diag
        run: |
          U=https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/8.9.1/gradle-8.9.1.pom
          if env | grep -qi '^https*_proxy='; then PX=SET; else PX=NONE; fi
          C1=$(curl -sS -o /dev/null -w '%{http_code}' "$U" || echo ERR)
          C4=$(curl -4 -sS -o /dev/null -w '%{http_code}' "$U" || echo ERR)
          cat > /tmp/P.java <<'JAVA'
          public class P { public static void main(String[] a) throws Exception {
            System.out.println(((java.net.HttpURLConnection) new java.net.URL(a[0]).openConnection()).getResponseCode()); } }
          JAVA
          JV=$(java /tmp/P.java "$U" 2>/tmp/jerr || tail -1 /tmp/jerr | tr -d '"' | cut -c1-40)
          echo "diag=proxy:$PX curl:$C1 curl4:$C4 java:$JV" | tee diag.txt
          echo "line=proxy:$PX curl:$C1 curl4:$C4 java:$JV" >> "$GITHUB_OUTPUT"
      - name: Terapkan proxy env ke Gradle (Claude fix 1)
        run: |
          python3 - <<'PYEOF'
          import os, pathlib, urllib.parse as u
          p = os.environ.get("HTTPS_PROXY") or os.environ.get("https_proxy")
          if p:
              x = u.urlparse(p); L = []
              for s in ("http", "https"):
                  L += [f"systemProp.{s}.proxyHost={x.hostname}", f"systemProp.{s}.proxyPort={x.port or 3128}"]
                  if x.username:
                      L += [f"systemProp.{s}.proxyUser={u.unquote(x.username)}", f"systemProp.{s}.proxyPassword={u.unquote(x.password or '')}"]
              d = pathlib.Path.home()/".gradle"; d.mkdir(exist_ok=True)
              (d/"gradle.properties").open("a").write("\n".join(L) + "\n")
              print("proxy applied to gradle.properties")
          else:
              print("no proxy env, nothing to apply")
          PYEOF
      - name: Ensure Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1); fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Install Gradle 8.11.1 from GitHub mirror
        run: |
          set -o pipefail
          curl -sL --retry 5 --retry-delay 5 -o /tmp/gradle.zip https://github.com/gradle/gradle-distributions/releases/download/v8.11.1/gradle-8.11.1-bin.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          /opt/gradle-8.11.1/bin/gradle --version > /dev/null
      - name: Build unsigned release APK
        working-directory: proj
        env:
          GH_TOKEN: ${{ github.token }}
          DIAG: ${{ steps.diag.outputs.line }}
        run: |
          OK=0
          for i in 1 2 3; do
            if /opt/gradle-8.11.1/bin/gradle assembleRelease --console=plain > build.log 2>&1; then OK=1; break; fi
            echo "attempt $i failed"; sleep 20
          done
          if [ "$OK" != "1" ]; then
            WW=$(grep -A3 "What went wrong" build.log | tr '\n' ' ' | tr -d '"' | cut -c1-120)
            gh issue create --title "FAIL16 [$DIAG] $WW" --body "see title" || true
            CB=$(grep -m2 "Caused by" build.log | tr -d '"' | cut -c1-240)
            gh issue create --title "CAUSE16: $CB" --body "see title" || true
            ST=$(grep -m1 -i "status code\|timed out\|timeout\|reset\|refused\|PKIX\|SSL" build.log | tr -d '"' | cut -c1-200)
            gh issue create --title "NET16: $ST" --body "see title" || true
            exit 1
          fi
          ls -la app/build/outputs/apk/release/
      - name: Attach APK to release
        working-directory: proj
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create build-${{ github.run_number }} app/build/outputs/apk/release/app-release-unsigned.apk --title "EzQ Bridge build ${{ github.run_number }}" --notes "Unsigned APK, signed locally after download"
